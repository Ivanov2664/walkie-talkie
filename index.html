<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <title>KRIS Radio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">

    <header>

        <div class="logo">
            📻 KRIS RADIO
        </div>

        <div id="status">
            ⚫ Няма връзка
        </div>

    </header>


    <!-- LOGIN -->

    <section
        id="login"
        class="card"
    >

        <h1>
            Интернет Уоки-Токи
        </h1>

        <p class="description">
            Въведи име и номер на канал.
        </p>


        <label>
            Твоето име
        </label>

        <input
            id="username"
            type="text"
            placeholder="Например Kris"
            maxlength="20"
        >


        <label>
            Канал
        </label>

        <input
            id="channel"
            type="text"
            placeholder="Например 145500"
            maxlength="20"
            autocomplete="off"
        >


        <button
            id="connect"
            class="primary"
        >
            🔗 Влез в канала
        </button>

    </section>


    <!-- RADIO -->

    <section
        id="radio"
        class="card radio hidden"
    >

        <div class="channel-box">

            <span>
                КАНАЛ
            </span>

            <strong id="currentChannel">
                ---
            </strong>

        </div>


        <div class="users-box">

            <h2>
                👥 В канала
            </h2>

            <div id="userList">
                Зареждане...
            </div>

        </div>


        <button
            id="pushToTalk"
            class="ptt"
        >

            <span class="mic">
                🎙️
            </span>

            <span>
                ЗАДРЪЖ И ГОВОРИ
            </span>

        </button>


        <div
            id="talkingStatus"
            class="talking-status"
        >
            Готов за разговор
        </div>


        <button
            id="disconnect"
            class="disconnect"
        >
            🚪 Напусни канала
        </button>

    </section>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="app.js"></script>

</body>

</html>
