<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>KRIS RADIO</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <header>

        <div class="logo">
            📻 KRIS RADIO
        </div>

        <div id="status">
            ⚫ Няма връзка
        </div>

    </header>


    <!-- LOGIN -->

    <div
        id="loginScreen"
        class="card"
    >

        <h1>
            Интернет Уоки-Токи
        </h1>

        <p>
            Въведи име и канал, за да се свържеш.
        </p>


        <label>
            👤 Име
        </label>

        <input
            id="username"
            type="text"
            placeholder="Например Kris"
            maxlength="20"
        >


        <label>
            📻 Канал
        </label>

        <input
            id="channel"
            type="text"
            placeholder="Например 145500"
            maxlength="30"
        >


        <button
            id="connect"
            class="primary"
        >
            🔗 ВЛЕЗ В КАНАЛА
        </button>

    </div>


    <!-- RADIO -->

    <div
        id="radioScreen"
        class="card hidden"
    >

        <div class="channel">

            <small>
                КАНАЛ
            </small>

            <strong id="currentChannel">
                ---
            </strong>

        </div>


        <div class="members">

            <h2>
                👥 В канала
            </h2>

            <div id="userList">
                Зареждане...
            </div>

        </div>


        <button
            id="ptt"
            class="ptt"
        >

            <span class="pttIcon">
                🎙️
            </span>

            <span id="pttText">
                ЗАДРЪЖ И ГОВОРИ
            </span>

        </button>


        <div
            id="talking"
            class="talking"
        >
            Готов за разговор
        </div>


        <button
            id="disconnect"
            class="disconnect"
        >
            🚪 НАПУСНИ КАНАЛА
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
